name: Linux CEF experimental build

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/linux-cef-runtime
  pull_request:
    branches:
      - experiment/linux-cef-runtime

permissions:
  contents: read

concurrency:
  group: linux-cef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux x64 CEF packages
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
      TAURI_CEF_REV: 5bb1c8cdca82dafb9fb92fe8494a8b37b10db143
      TAURI_CEF_PLUGINS_REV: 1423992771e0b57582ca3b06a6adc46ec26aa784
      CEF_VERSION: 151.1.0+151.3.12
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0

      - name: Install Linux CEF build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::ForceIPv4=true install -y \
            build-essential \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            ninja-build \
            patchelf \
            pkg-config \
            rpm \
            xdg-utils

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Blockbench skin editor dependencies
        run: npm ci
        working-directory: third-party/blockbench

      - name: Replace Gradle mirror
        uses: ./.github/actions/replace-gradle-mirror

      - name: Set build version from the latest release tag
        shell: bash
        run: |
          set -euo pipefail
          version_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA")"
          node scripts/axolotl/set-version.mjs "$version_tag"
          version="${version_tag#v}"
          echo "CEF_BUILD_TAG=$version_tag" >> "$GITHUB_ENV"
          echo "CEF_BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build frontend
        run: pnpm --filter @modrinth/app-frontend build

      - name: Install matching Tauri CEF CLI
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cli_src="${RUNNER_TEMP}/tauri-cef-cli-src"
          cli_root="${RUNNER_TEMP}/tauri-cef-cli"
          git clone https://github.com/tauri-apps/tauri "$cli_src"
          git -C "$cli_src" checkout --detach "$TAURI_CEF_REV"
          test "$(git -C "$cli_src" rev-parse HEAD)" = "$TAURI_CEF_REV"
          git -C "$cli_src" apply --check \
            "$GITHUB_WORKSPACE/.github/patches/tauri-cef-appimage-symlink.patch"
          git -C "$cli_src" apply \
            "$GITHUB_WORKSPACE/.github/patches/tauri-cef-appimage-symlink.patch"
          cargo install \
            --path "$cli_src/crates/tauri-cli" \
            --locked \
            --root "$cli_root"
          echo "$cli_root/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated CEF build toolchain
        shell: bash
        run: |
          cargo_home="${RUNNER_TEMP}/cargo-cef-home"
          cef_path="${RUNNER_TEMP}/tauri-cef"
          mkdir -p "$cargo_home" "$cef_path"
          cp .cargo/config-cef-linux.toml "$cargo_home/config.toml"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "CEF_PATH=$cef_path" >> "$GITHUB_ENV"

      - name: Activate locked Linux CEF dependency graph
        run: |
          git apply --check .github/patches/linux-cef-manifest.patch
          git apply .github/patches/linux-cef-manifest.patch
          cp Cargo.cef-linux.lock Cargo.lock
          # set-version updates only workspace package versions. Let Cargo
          # synchronize those local entries before enforcing the locked graph.
          cargo metadata \
            --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu \
            --no-default-features \
            --features cef,custom-protocol,updater \
            > /dev/null
          cargo metadata \
            --locked \
            --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu \
            --no-default-features \
            --features cef,custom-protocol,updater \
            > /dev/null

          tree_file="${RUNNER_TEMP}/linux-cef-tree.txt"
          cargo tree \
            --locked \
            --package theseus_gui \
            --target x86_64-unknown-linux-gnu \
            --no-default-features \
            --features cef,custom-protocol,updater \
            --edges normal,build \
            > "$tree_file"
          grep -F 'tauri-runtime-cef' "$tree_file"
          grep -F "cef v$CEF_VERSION" "$tree_file"
          grep -F "tauri-plugin v2.6.3 (https://github.com/tauri-apps/tauri?rev=$TAURI_CEF_REV" "$tree_file"
          grep -F "tauri-plugin-fs v2.5.1 (https://github.com/tauri-apps/plugins-workspace?rev=$TAURI_CEF_PLUGINS_REV" "$tree_file"
          grep -F "tauri-plugin-http v2.5.9 (https://github.com/tauri-apps/plugins-workspace?rev=$TAURI_CEF_PLUGINS_REV" "$tree_file"
          grep -F "tauri-plugin-opener v2.5.4 (https://github.com/tauri-apps/plugins-workspace?rev=$TAURI_CEF_PLUGINS_REV" "$tree_file"
          grep -F 'schemars v1.2.1' "$tree_file"
          if grep -Eq 'tauri-runtime-wry|webkit2gtk' "$tree_file"; then
            echo 'Linux CEF graph unexpectedly contains Wry or WebKitGTK'
            grep -E 'tauri-runtime-wry|webkit2gtk' "$tree_file"
            exit 1
          fi

      - name: Build Linux CEF packages
        working-directory: apps/app
        run: |
          cargo tauri build \
            --bundles deb,rpm,appimage \
            --features cef,custom-protocol,updater \
            --config tauri-release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            -- \
            --no-default-features

      - name: Upload Linux CEF packages
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axolotl-linux-cef-${{ env.CEF_BUILD_TAG }}-${{ github.sha }}
          path: |
            target/release/bundle/deb/**/*.deb
            target/release/bundle/rpm/**/*.rpm
            target/release/bundle/appimage/**/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Verify CEF Linux package contents
        shell: bash
        run: |
          set -euo pipefail

          check_cef_files() {
            local package="$1"
            local contents="$2"
            for required in libcef.so resources.pak locales/en-US.pak chrome-sandbox; do
              if ! grep -Fq "$required" <<< "$contents"; then
                echo "$package is missing CEF runtime file: $required"
                return 1
              fi
            done
          }

          mapfile -d '' debs < <(find target/release/bundle/deb -type f -name '*.deb' -print0)
          if (( ${#debs[@]} == 0 )); then
            echo 'No Deb package was produced'
            exit 1
          fi

          for deb in "${debs[@]}"; do
            echo "Checking $deb"
            contents="$(dpkg-deb --contents "$deb")"
            printf '%s\n' "$contents"
            package_version="$(dpkg-deb --field "$deb" Version)"
            if [[ "$package_version" != "$CEF_BUILD_VERSION" ]]; then
              echo "$deb has version $package_version; expected $CEF_BUILD_VERSION from $CEF_BUILD_TAG"
              exit 1
            fi
            check_cef_files "$deb" "$contents"

            sandbox_mode="$(awk '/chrome-sandbox$/ { print $1 }' <<< "$contents")"
            if [[ "$sandbox_mode" != -rws* ]]; then
              echo "$deb has an unsafe chrome-sandbox mode: ${sandbox_mode:-missing}"
              exit 1
            fi

            depends="$(dpkg-deb --field "$deb" Depends)"
            if grep -qi webkit <<< "$depends"; then
              echo "$deb unexpectedly depends on WebKitGTK: $depends"
              exit 1
            fi
            echo "Deb dependencies: $depends"
          done

          mapfile -d '' rpms < <(find target/release/bundle/rpm -type f -name '*.rpm' -print0)
          if (( ${#rpms[@]} == 0 )); then
            echo 'No RPM package was produced'
            exit 1
          fi

          for rpm_package in "${rpms[@]}"; do
            echo "Checking $rpm_package"
            contents="$(rpm -qplv "$rpm_package")"
            printf '%s\n' "$contents"
            package_version="$(rpm -qp --qf '%{VERSION}' "$rpm_package")"
            if [[ "$package_version" != "$CEF_BUILD_VERSION" ]]; then
              echo "$rpm_package has version $package_version; expected $CEF_BUILD_VERSION from $CEF_BUILD_TAG"
              exit 1
            fi
            check_cef_files "$rpm_package" "$contents"

            sandbox_mode="$(awk '/chrome-sandbox$/ { print $1 }' <<< "$contents")"
            if [[ "$sandbox_mode" != -rws* ]]; then
              echo "$rpm_package has an unsafe chrome-sandbox mode: ${sandbox_mode:-missing}"
              exit 1
            fi

            requires="$(rpm -qpR "$rpm_package")"
            if grep -qi webkit <<< "$requires"; then
              echo "$rpm_package unexpectedly depends on WebKitGTK: $requires"
              exit 1
            fi
            echo "RPM dependencies:"
            printf '%s\n' "$requires"
          done

          mapfile -d '' appimages < <(find target/release/bundle/appimage -type f -name '*.AppImage' -print0)
          if (( ${#appimages[@]} == 0 )); then
            echo 'No AppImage package was produced'
            exit 1
          fi

          for appimage in "${appimages[@]}"; do
            echo "Checking $appimage"
            if [[ "$(basename "$appimage")" != *"_${CEF_BUILD_VERSION}_"* ]]; then
              echo "$appimage filename does not contain version $CEF_BUILD_VERSION from $CEF_BUILD_TAG"
              exit 1
            fi

            appimage_path="$(realpath "$appimage")"
            extract_dir="$(mktemp -d)"
            chmod +x "$appimage_path"
            (
              cd "$extract_dir"
              "$appimage_path" --appimage-extract > /dev/null
            )
            appdir="$(realpath "$extract_dir/squashfs-root")"
            contents="$(find "$appdir" -printf '%M %p\n')"
            printf '%s\n' "$contents"
            check_cef_files "$appimage" "$contents"

            sandbox_path="$(find "$appdir" -type f -name chrome-sandbox -print -quit)"
            sandbox_mode="$(stat -c '%A' "$sandbox_path")"
            if [[ "$sandbox_mode" != -rws* ]]; then
              echo "$appimage has an unsafe chrome-sandbox mode: ${sandbox_mode:-missing}"
              exit 1
            fi
            if find "$appdir" -iname '*webkit*' -print -quit | grep -q .; then
              echo "$appimage unexpectedly contains WebKitGTK files"
              find "$appdir" -iname '*webkit*' -print
              exit 1
            fi
            rm -rf "$extract_dir"
          done

          find target/release/bundle -maxdepth 4 -type f -printf '%p (%s bytes)\n'
