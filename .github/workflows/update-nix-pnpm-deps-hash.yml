name: Update nix pnpm dependency hash

on:
  push:
    branches:
      - main
    paths:
      - pnpm-lock.yaml
      - .github/workflows/update-nix-pnpm-deps-hash.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Recompute the pnpm dependency hash
        run: nix develop . --accept-flake-config --command update-pnpm-deps

      - name: Commit the updated hash
        run: |
          if git diff --quiet -- nix/axolotl.nix; then
            echo "nix/axolotl.nix is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/axolotl.nix
          git commit -m "chore(nix): update pnpm dependency hash [skip ci]"
          git push
