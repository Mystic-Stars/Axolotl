name: Axolotl desktop CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  pull_request:
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/axolotl/check-migrations.mjs --base "${MIGRATION_BASE_REF:-HEAD^}"
          node scripts/axolotl/check-migrations.mjs --release
      - run: node scripts/axolotl/brand-guard.mjs
      - run: node scripts/axolotl/i18n-check.mjs
      - run: cargo fmt --all --check

  desktop:
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        include:
          # Authoritative typecheck/unit-test gate. Other OSes must not repeat it.
          - os: ubuntu-latest
            role: check
          # macOS-only cfg code still needs a compile canary; no tests, no bundles.
          - os: macos-latest
            role: check-platform
          # Packaging only. Consumes the frontend/installer-ui assets built once.
          - os: windows-latest
            role: package
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
      # Keep PR packaging on the fast release profile; tags re-enable full LTO.
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Replaces an sccache setup whose startup probe failed on every run:
      # the shared cache service rejected it, the enable step was skipped, and
      # Windows rebuilt the whole dependency tree uncached (~56 minutes).
      # The shared key deliberately matches the release workflow's build job,
      # so tagged releases can restore the cache this job keeps warm on main.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: axolotl-rust-deps
          # A failing build still warms the cache for the next attempt.
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Install Blockbench skin editor dependencies
        run: npm ci
        working-directory: third-party/blockbench
      - uses: ./.github/actions/replace-gradle-mirror
      - name: Build frontend once
        run: pnpm --filter @modrinth/app-frontend build
      - name: Test version metadata writes
        if: matrix.role == 'check'
        run: cargo test --package theseus writing_version_info_creates_missing_parent_directory
      - name: Check theseus_gui
        if: matrix.role == 'check' || matrix.role == 'check-platform'
        run: cargo check --package theseus_gui --features updater
      - name: Build installer UI once
        if: matrix.role == 'package'
        run: cargo build --release --package axolotl-installer-ui
      # Both Windows installers share the same cargo features and skip
      # beforeBuildCommand so the second NSIS package reuses the release exe
      # and the already-built frontend / installer-ui assets.
      - name: Build modern Windows installer
        if: matrix.role == 'package'
        run: pnpm --filter @modrinth/app tauri build --config tauri-release.conf.json --config tauri-modern.conf.json --config tauri-reuse-assets.conf.json
      - name: Stash modern Windows installer
        if: matrix.role == 'package'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one modern NSIS installer, found $($installers.Count)"
          }
          $stashDir = 'target/release/bundle/nsis-modern'
          New-Item -ItemType Directory -Force -Path $stashDir | Out-Null
          Move-Item -Force $installers[0].FullName $stashDir
          Write-Output "Stashed modern installer: $($installers[0].Name)"
      - name: Build native NSIS Windows installer
        if: matrix.role == 'package'
        run: pnpm --filter @modrinth/app tauri build --config tauri-release.conf.json --config tauri-native.conf.json --config tauri-reuse-assets.conf.json
      - name: Verify native NSIS Windows installer
        if: matrix.role == 'package'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one native NSIS installer, found $($installers.Count)"
          }
          Write-Output "Built native installer: $($installers[0].Name)"
          $modern = @(Get-ChildItem target/release/bundle/nsis-modern -Filter '*-setup.exe' -File)
          if ($modern.Count -ne 1) {
            throw "Expected one stashed modern NSIS installer, found $($modern.Count)"
          }
          Write-Output "Modern installer preserved: $($modern[0].Name)"

  website:
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axolotl/website build
